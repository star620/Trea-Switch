name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore TraeSwitch.csproj

      - name: Test
        run: dotnet test TraeSwitch.Tests\TraeSwitch.Tests.csproj -c Release

      - name: Publish (self-contained single-file, win-x64)
        run: |
          dotnet publish TraeSwitch.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraeSwitch-win-x64
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TraeSwitch.exe
          generate_release_notes: true