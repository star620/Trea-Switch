name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 GitHub Release 需要写权限（默认 GITHUB_TOKEN 是只读，会 403 失败）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore TraeSwitch.csproj

      - name: Test
        run: dotnet test TraeSwitch.Tests\TraeSwitch.Tests.csproj -c Release

      - name: Publish (self-contained single-file, win-x64)
        shell: pwsh
        run: |
          # 版本取自 tag（如 v1.2.0 → 1.2.0）；手动触发（branch）时报 1.0.0
          $v = "${{ github.ref_name }}"
          if ($v -match '^v?([0-9]+\.[0-9]+\.[0-9]+)') { $ver = $matches[1] } else { $ver = "1.0.0" }
          dotnet publish TraeSwitch.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyVersion=$ver -p:FileVersion=$ver -p:InformationalVersion=$ver `
            -o dist
          Write-Host "Bundled version: $ver"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraeSwitch-win-x64
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TraeSwitch.exe
          generate_release_notes: true